; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = mjlo_8MB.csv
board_build.f_cpu = 80000000
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder, log2file
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D RADIOLIB_DEBUG_PROTOCOL=1
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D MJLO_VERSION='"v2.2.0"'

[env:mjlo]
lib_deps = 
	adafruit/Adafruit BusIO@^1.14.3
	adafruit/Adafruit GFX Library@^1.11.7
	adafruit/Adafruit Unified Sensor@^1.1.13
	adafruit/Adafruit TSL2591 Library@^1.4.3
	adafruit/Adafruit AS7331 Library@^1.0.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
	sensirion/Sensirion Core@^0.7.1
	sensirion/Sensirion I2C SEN5X@^0.3.0
	sensirion/Sensirion I2C SCD4x@^1.0.0
	stm32duino/STM32duino LSM6DSR@^2.2.0
	mikalhart/TinyGPSPlus@^1.0.3
	jgromes/RadioLib@7.6.0
	zinggjm/GxEPD2@^1.5.6
	kosme/arduinoFFT@^2.0.4
	ayushsharma82/ElegantOTA@^3.1.0
